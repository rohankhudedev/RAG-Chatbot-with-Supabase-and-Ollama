services:

  # ==========================================================
  # Next.js Application
  # ==========================================================
  app:

    # Build the Next.js application using Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile

    # Fixed container name.
    container_name: rag-app

    # Automatically restart the application if it crashes
    # or the Docker server restarts.
    restart: unless-stopped

    # Host port 3000 → Container port 3000
    #
    # You can access the application using:
    #
    # http://SERVER_IP:3000
    #
    ports:
      - '3000:3000'

    # Environment variables available inside
    # the Next.js container.
    environment:

      # Next.js production mode.
      NODE_ENV: production

      # Supabase project URL.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}

      # Supabase service-role key.
      #
      # IMPORTANT:
      # This must only be used server-side.
      # Never expose it to browser/client-side code.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # IMPORTANT:
      # "ollama" is the Docker Compose service name.
      #
      # Next.js container can communicate with the Ollama
      # container using:
      #
      # http://ollama:11434
      #
      # DO NOT use 127.0.0.1 here.
      OLLAMA_BASE_URL: http://ollama:11434

      # Embedding model used for creating vector embeddings.
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}

      # Chat/LLM model used for generating answers.
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}

    # Don't start the Next.js app until ollama-init
    # has successfully completed.
    #
    # ollama-init downloads the required models.
    depends_on:
      ollama-init:
        condition: service_completed_successfully


  # ==========================================================
  # Ollama
  # ==========================================================
  ollama:

    # Official Ollama Docker image.
    image: ollama/ollama:latest

    # Fixed container name.
    container_name: rag-ollama

    # Restart Ollama automatically if it crashes
    # or the server restarts.
    restart: unless-stopped

    # Expose port 11434 ONLY to other Docker containers.
    #
    # We intentionally do NOT use:
    #
    # ports:
    #   - '11434:11434'
    #
    # because Ollama should not be publicly accessible.
    expose:
      - '11434'

    # Persist Ollama models.
    #
    # Models downloaded by:
    #
    #   ollama pull llama3.1
    #   ollama pull nomic-embed-text
    #
    # are stored here.
    #
    # Therefore, if the Ollama container is recreated,
    # the models don't need to be downloaded again.
    volumes:
      - ollama_data:/root/.ollama


  # ==========================================================
  # Ollama Model Initialization
  # ==========================================================
  ollama-init:

    # Use the same Ollama image.
    image: ollama/ollama:latest

    # Fixed container name.
    container_name: rag-ollama-init

    # Start after the Ollama container starts.
    depends_on:
      - ollama

    environment:

      # Tell this temporary container where Ollama is running.
      OLLAMA_HOST: http://ollama:11434

      # Models to download.
      #
      # These values come from .env
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}

    # Run a shell command instead of the normal Ollama
    # container command.
    entrypoint: ['/bin/sh', '-c']

    # --------------------------------------------------------
    # Initialization script
    # --------------------------------------------------------
    command: >
      "
      echo 'Waiting for Ollama...';

      # Keep checking until Ollama is available.
      until ollama list >/dev/null 2>&1; do
        sleep 2;
      done;

      # Download the chat model.
      #
      # $$ is used because Docker Compose uses $ for
      # variable substitution. $$ passes $ into the container.
      echo 'Pulling chat model: '$$OLLAMA_CHAT_MODEL;
      ollama pull $$OLLAMA_CHAT_MODEL;

      # Download the embedding model.
      echo 'Pulling embedding model: '$$OLLAMA_EMBED_MODEL;
      ollama pull $$OLLAMA_EMBED_MODEL;

      echo 'Models ready.';
      "

    # This container is intentionally temporary.
    #
    # It starts → checks Ollama → downloads models → exits.
    #
    # It does NOT need to remain running.
    restart: 'no'


# ============================================================
# Persistent Docker volume
# ============================================================
volumes:

  # Stores Ollama models permanently.
  #
  # Example:
  #
  # ollama_data
  # ├── llama3.1
  # └── nomic-embed-text
  #
  ollama_data: